<!DOCTYPE html>
<html lang="en">   

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>
<body>
    
    <div class="container">

        <header>
            <h1>Welcome to My Web Page!</h1>
        </header> 

        <div class="advice">
            <h2>Advice of the Day</h2>
            <p id="advice">Loading your advice...</p>
            <button onclick="getAdvise()">Let's try that again</button>
            
        </div>

        <nav>
            <h2>Navigation</h2>
            <ul>
                <button onclick="loadMarkdown('home.md', 'content')">Home</button>
                <button onclick="loadMarkdown('shm.md', 'content')">Sustainable Heritage Management</button>
                <button onclick="loadMarkdown('dth.md', 'content')">Digital Technologies in SHM</button>
                <button onclick="loadMarkdown('mywebsite.md','content')">My Website: Reflections</button>
            </ul>

        </nav>

        <main>
            <section id="content"></section>
        </main>

        <footer>
            <p>&copy; 2026 Web Page of Josephine E. B. Dinesen. Student Number: 202006617. Total Characters: 14.690.</p>
        </footer>

    </div>

<script>
    async function loadMarkdown(filename, ComponentId) {
        const response = await fetch(filename);
        const text = await response.text();
        document.getElementById(ComponentId).innerHTML = marked.parse(text);
    }

loadMarkdown('home.md', 'content');

async function getAdvise() {
    const response = await fetch('https://api.adviceslip.com/advice');
    const data = await response.json();
    document.getElementById('advice').innerHTML = data.slip.advice;
}

getAdvise();

</script>


</body>

</html>
